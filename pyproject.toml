[project]
name = "widget-calculator"
version = "0.1.0"
description = "Multi-window widget calculator for Windows with variables, conversions, history, tray mode, and themes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pint>=0.24",
  "pyside6>=6.8",
  "requests>=2.32",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-qt>=4",
  "ruff>=0.11",
  "mypy>=1.15",
  "pyinstaller>=6.10",
]

[project.scripts]
widget-calculator = "widget_calc.presentation.qt.app:cli"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["widget_calc"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 132
exclude = ["__pycache__", ".venv", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py", "test_*.py"]
